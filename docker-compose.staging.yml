services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: belgram_staging
      POSTGRES_USER: belgram
      POSTGRES_PASSWORD: belgram_staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belgram -d belgram_staging"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports: ['55432:5432']
    volumes: [belgram_staging_postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports: ['56379:6379']
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql+asyncpg://belgram:belgram_staging@postgres:5432/belgram_staging
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: staging-only-change-me
      CORS_ORIGINS: http://localhost:15173
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports: ['18000:8000']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  belgram_staging_postgres:
