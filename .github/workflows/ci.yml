name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  staging-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f docker-compose.staging.yml config
      - run: docker compose -f docker-compose.staging.yml build api
      - run: docker compose -f docker-compose.staging.yml up -d
      - name: Wait for staging API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml ps
          docker compose -f docker-compose.staging.yml logs --no-color api
          exit 1
      - run: curl --fail --silent http://127.0.0.1:18000/ready
      - if: always()
        run: docker compose -f docker-compose.staging.yml down -v
